name: Python adapter tests

on:
  push:
    branches:
      - "repair/**"
  pull_request:
    branches:
      - main

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install adapter dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run adapter regression suite
        run: python -m unittest -v test_aura_g_adapter

  full-pipeline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Install matched CPU PyTorch packages
        run: python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Run full-pipeline smoke tests
        run: python -m unittest -v test_aura_g_pipeline
