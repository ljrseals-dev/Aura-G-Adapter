name: AURA-G validation

on:
  push:
    branches:
      - "repair/**"
      - "integrate/**"
  pull_request:
    branches:
      - main

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install adapter dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run adapter regression suite
        run: python -m unittest -v test_aura_g_adapter

  full-pipeline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Install matched CPU PyTorch packages
        run: python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Run full-pipeline smoke tests
        run: python -m unittest -v test_aura_g_pipeline

  cpp-waveguide-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile C++17 engine regression tests
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -I. AuraGEngine.cpp tests/test_aura_g_engine.cpp -o /tmp/test_aura_g_engine
      - name: Run C++17 engine regression tests
        run: /tmp/test_aura_g_engine
